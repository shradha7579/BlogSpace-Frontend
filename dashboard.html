
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - BlogSpace</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVIGATION BAR -->

    <nav>
        <h2>BlogSpace</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="my-blogs.html">View My Blogs</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
    </nav>


    <!-- DASHBOARD SECTION -->

    <section class="dashboard-section">

        <div class="dashboard-container">

            <h1>Welcome to Your Dashboard!</h1>

            <p id="welcomeMessage">
                Welcome to BlogSpace.
            </p>

            <div class="dashboard-cards">

                <div class="dashboard-card">
                    <h2>My Blogs</h2>
                    <p>Create and manage your blogs.</p>
                    <a href="my-blogs.html">View My Blogs</a>
                </div>

                <div class="dashboard-card">
                    <h2>Explore Blogs</h2>
                    <p>Read interesting blogs from others.</p>
                    <a href="index.html">Explore Now</a>
                </div>

                <div class="dashboard-card">
                    <h2>My Profile</h2>
                    <p>Welcome to your personal account.</p>
                    <span id="profileName">User</span>
                </div>

            </div>

        </div>

    </section>


    <script src="js/script.js"></script>

</body>
</html>
